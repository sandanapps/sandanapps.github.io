name: Update release data

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run scraper
        working-directory: PokeFetcher
        run: python3 scripts/scrape.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- PokeFetcher/data/releases.json; then
            echo "No changes to release data."
          else
            git add PokeFetcher/data/releases.json
            git commit -m "chore: update release data"
            git push
          fi
