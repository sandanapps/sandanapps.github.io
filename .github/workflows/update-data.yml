name: Update release data

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run scraper
        working-directory: PokeFetcher
        run: python3 scripts/scrape.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PokeFetcher/data/releases.json PokeFetcher/data/sprites
          if git diff --cached --quiet; then
            echo "No changes to release data."
            exit 0
          fi
          git commit -m "chore: update release data"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            echo "Push rejected, retrying ($i)..."
            sleep 5
          done
          echo "Failed to push after retries."
          exit 1
